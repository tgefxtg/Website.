<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b2019" />
    <title>Package manager | Harley Wild Escape Holidays</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=gallery-upload-2" />
  </head>
  <body class="admin-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="admin-header">
      <a class="brand admin-brand" href="index.html" aria-label="Return to Harley Wild Escape Holidays home"><img src="logo.webp" alt="Harley Wild Escape Holidays" class="brand-logo" /><span class="brand-text">HARLEY <em>WILD ESCAPE HOLIDAYS</em></span></a>
      <a class="text-link light" href="index.html">← View website</a>
    </header>
    <main id="main" class="admin-shell">
      <p class="eyebrow"><span></span> PRIVATE PACKAGE MANAGEMENT</p>
      <h1>Shape every<br /><em>escape.</em></h1>
      <p class="admin-intro">Sign in with the authorised administrator account to update the journeys shown on the website.</p>
      <section class="admin-login" data-login-panel>
        <p data-login-copy>Sign in to manage tour packages.</p>
        <button class="button button-gold" type="button" data-login>Admin sign in <span>↗</span></button>
      </section>
      <section class="admin-manager" data-manager hidden aria-labelledby="manager-title">
        <div class="admin-toolbar"><div><p class="section-kicker"><span>01</span> YOUR LIVE COLLECTION</p><h2 id="manager-title">Tour <em>packages.</em></h2></div><button class="button button-light" type="button" data-logout>Sign out</button></div>
        <p class="admin-status" data-status aria-live="polite"></p>
        <div class="admin-packages" data-package-list></div>
        <div class="admin-actions"><button class="button button-outline" type="button" data-add>Add package <span>+</span></button><button class="button button-gold" type="button" data-save>Save all changes <span>↗</span></button></div>
      </section>
    </main>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="admin-photo.js?v=gallery-upload-2" defer></script>
    <script src="admin.js?v=gallery-upload-2" defer></script>
  </body>
</html>
